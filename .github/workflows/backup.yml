# Back up all claude.ai chats (LAB-88).
# Stage 1: check only — the backup is made in the runner's temp dir and thrown
# away; the summary shows how many chats and files came through.
# Storage in R2 comes next.
# This fork is public (forks of public repos can't be private), so run logs are
# public too: the job prints counts only — no chat names, file names or paths.
# The sessionKey cookie comes from 1Password (vault "Github_TFTL") via the org
# secret OP_SERVICE_ACCOUNT_TOKEN; it is never printed.
name: backup
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this fork
        run: pip install -q .
      - name: Load sessionKey from 1Password
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SESSION_KEY: op://Github_TFTL/claude-ai-session-key/credential
      - name: Check login (status only)
        env:
          SESSION_KEY: ${{ steps.op.outputs.SESSION_KEY }}
        run: |
          k="$(printf '%s' "$SESSION_KEY" | tr -d '[:space:]')"
          case "$k" in sk-ant-*) echo "key: starts with sk-ant-, length ${#k}";; *) echo "::error::key does not start with sk-ant- (length ${#k})";; esac
          code=$(curl -s -o "$RUNNER_TEMP/b" -D "$RUNNER_TEMP/h" -w '%{http_code}' -H "Cookie: sessionKey=$k" \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' \
            https://claude.ai/api/organizations)
          echo "claude.ai/api/organizations: HTTP $code"
          grep -qi '^cf-mitigated: *challenge' "$RUNNER_TEMP/h" && echo "Cloudflare challenge: yes (GitHub runner IP is blocked)" || echo "Cloudflare challenge: no"
          grep -qiE 'just a moment|challenge-platform' "$RUNNER_TEMP/b" && echo "body: Cloudflare challenge page" || true
          head -c1 "$RUNNER_TEMP/b" | grep -q '\[' && echo "body: JSON list (login works)" || true
          grep -oE '"type" *: *"[a-z_]+"' "$RUNNER_TEMP/b" | head -3 || true
      - name: Back up
        env:
          SESSION_KEY: ${{ steps.op.outputs.SESSION_KEY }}
        run: |
          set -o pipefail
          printf '%s\n' "$SESSION_KEY" | claude-backup "$RUNNER_TEMP/backup" 2> "$RUNNER_TEMP/stderr.log" > "$RUNNER_TEMP/stdout.log" || {
            code=$?
            echo "::error::claude-backup exited with $code"
            grep -oE '\b(401|403|429|5[0-9]{2})\b[^,]{0,40}' "$RUNNER_TEMP/stderr.log" | sed -E 's#https?://[^ ]*##g' | sort | uniq -c | head -5 || true
            grep -oE '[A-Za-z]+(Error|Exception)' "$RUNNER_TEMP/stderr.log" | sort | uniq -c | head -5 || true
            exit $code
          }
      - name: Summary
        if: always()
        run: |
          d="$RUNNER_TEMP/backup"
          chats=$(find "$d" -path '*/chats/*.json' 2>/dev/null | wc -l)
          files=$(find "$d" -path '*/files/*' -type f 2>/dev/null | wc -l)
          size=$(du -sh "$d" 2>/dev/null | cut -f1)
          unreachable=$(grep -c '^unreachable file' "$RUNNER_TEMP/stderr.log" 2>/dev/null || true)
          {
            echo "## claude-backup"
            echo "- chats: ${chats}"
            echo "- files: ${files}"
            echo "- size: ${size:-0}"
            echo "- unreachable files: ${unreachable:-0}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
